<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.ico" />
    <title>SbiRadio</title>
    <link href="css/global.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>SbiRadio - Tu Emisora</h1>
      <span class="subtitle">
        ~Un programa lleno de nostalgia, confort y buena música.
      </span>
    </header>
    <main>
      <div class="player-container">
        <audio id="radio-player" controls preload="none">
          <source src="https://radios.yanapak.org/SbiRadio" type="audio/mpeg" />
        </audio>
      </div>
      <div class="cover-container">
        <img src="./assets/img/disco.webp" alt="disco" />
      </div>
    </main>
    <footer class="end">
      <div class="end-logo">
        <img
          src="./assets/img/Sbi-B.webp"
          alt="SbiDev Logo"
          width="160px"
          height="128px"
          draggable="false"
        />
        <span class="end-title"> by ~SbiDev</span>
      </div>
      <div class="memerandum">
        <p>&copy; 2026 Radio Comunitaria. Hecho con ❤️ y Software Libre.</p>
      </div>
    </footer>
  </body>
</html>
